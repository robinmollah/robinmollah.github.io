<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robin Mollah — Lab</title>
  <meta name="description" content="An interactive 3D experiment by Robin Mollah, Senior Software Engineer.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 25% 70%, #1e5c50 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, #123744 0%, transparent 50%),
        #0a1e27;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    #vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(8, 18, 24, 0.72) 100%);
      pointer-events: none; z-index: 1;
    }

    #back {
      position: fixed; top: 28px; left: 32px; z-index: 10;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: rgba(220, 210, 195, 0.38); text-decoration: none;
      transition: color 220ms ease;
      animation: fadeUp 1s ease 0.6s both;
    }
    #back:hover { color: rgba(220, 210, 195, 0.78); }

    #badge {
      position: fixed; top: 28px; right: 32px; z-index: 10;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(74, 171, 158, 0.45);
      animation: fadeUp 1s ease 0.7s both;
    }

    #ui {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; text-align: center; padding: 24px;
    }

    .eyebrow {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: rgba(74, 171, 158, 0.7); margin-bottom: 22px;
      animation: fadeUp 0.9s ease 0.4s both;
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800; font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95; color: #f0ebe0;
      letter-spacing: -0.02em; margin-bottom: 18px;
      animation: fadeUp 0.9s ease 0.5s both;
    }

    .subtitle {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: clamp(0.82rem, 1.8vw, 0.98rem);
      color: rgba(220, 210, 195, 0.5);
      letter-spacing: 0.04em; margin-bottom: 48px;
      animation: fadeUp 0.9s ease 0.6s both;
    }

    .links {
      display: flex; gap: 14px;
      pointer-events: all;
      animation: fadeUp 0.9s ease 0.75s both;
    }

    .links a {
      display: inline-flex; align-items: center;
      padding: 10px 22px; border-radius: 5px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      text-decoration: none; letter-spacing: 0.03em;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    .links a:hover { transform: translateY(-2px); }

    .link-primary {
      background: rgba(74, 171, 158, 0.12);
      border: 1px solid rgba(74, 171, 158, 0.35); color: #4aab9e;
    }
    .link-primary:hover { background: rgba(74, 171, 158, 0.22); border-color: rgba(74, 171, 158, 0.6); }

    .link-ghost {
      border: 1px solid rgba(220, 210, 195, 0.15);
      color: rgba(220, 210, 195, 0.45);
    }
    .link-ghost:hover { border-color: rgba(220, 210, 195, 0.3); color: rgba(220, 210, 195, 0.8); }

    #hint {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%); z-index: 10;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.68rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(220, 210, 195, 0.2);
      animation: fadeUp 1s ease 1.2s both; white-space: nowrap;
      transition: opacity 0.4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) { .links { flex-direction: column; align-items: center; } }
  </style>
</head>
<body>
  <canvas id="webgl" role="img" aria-label="Interactive 3D particle network by Robin Mollah"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <a id="back" href="/">← robinmollah.com</a>
  <div id="badge">Lab</div>

  <div id="ui">
    <p class="eyebrow">Creative Experiment</p>
    <h1>Robin Mollah</h1>
    <p class="subtitle">Senior Software Engineer &nbsp;·&nbsp; Backend · Cloud · AI</p>
    <div class="links">
      <a class="link-primary" href="/">View Portfolio</a>
      <a class="link-ghost" href="https://github.com/robinmollah" target="_blank" rel="noopener">GitHub</a>
      <a class="link-ghost" href="https://linkedin.com/in/robinmollah" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>

  <p id="hint">Move your mouse to interact</p>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    camera.position.z = 58;

    function resize() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    // ── Particles ─────────────────────────────────────────────────────
    const N = 160;
    const pos   = new Float32Array(N * 3);
    const vel   = new Float32Array(N * 3);
    const phase = new Float32Array(N);
    const act   = new Float32Array(N);
    const pCol  = new Float32Array(N * 3);

    for (let i = 0; i < N; i++) {
      pos[i*3]   = (Math.random() - 0.5) * 110;
      pos[i*3+1] = (Math.random() - 0.5) * 75;
      pos[i*3+2] = (Math.random() - 0.5) * 80;
      vel[i*3]   = (Math.random() - 0.5) * 0.013;
      vel[i*3+1] = (Math.random() - 0.5) * 0.013;
      vel[i*3+2] = (Math.random() - 0.5) * 0.013;
      phase[i]   = Math.random() * Math.PI * 2;
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pos,  3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    const pMat = new THREE.PointsMaterial({ size: 1.8, sizeAttenuation: true, vertexColors: true, transparent: true, opacity: 0.95 });
    scene.add(new THREE.Points(pGeo, pMat));

    // ── Lines ─────────────────────────────────────────────────────────
    const maxSegs = N * (N - 1) / 2;
    const lPos = new Float32Array(maxSegs * 6);
    const lCol = new Float32Array(maxSegs * 6);
    const lGeo = new THREE.BufferGeometry();
    lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
    lGeo.setAttribute('color',    new THREE.BufferAttribute(lCol, 3));
    const lMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55 });
    scene.add(new THREE.LineSegments(lGeo, lMat));

    // ── Mouse ──────────────────────────────────────────────────────────
    const mouse      = new THREE.Vector2(9999, 9999);
    const mouseWorld = new THREE.Vector3();
    const plane      = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const raycaster  = new THREE.Raycaster();
    let   camTX = 0, camTY = 0;

    function onMove(x, y) {
      mouse.x =  (x / innerWidth)  * 2 - 1;
      mouse.y = -(y / innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      raycaster.ray.intersectPlane(plane, mouseWorld);
      const hint = document.getElementById('hint');
      if (hint) hint.style.opacity = '0';
    }

    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      e.preventDefault();
      onMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    // ── Scroll / swipe → fly-through ──────────────────────────────────
    let flying = false, flyProgress = 0;

    function triggerFlyThrough() {
      if (flying) return;
      flying = true;
      document.getElementById('ui').style.transition    = 'opacity 0.6s ease';
      document.getElementById('ui').style.opacity       = '0';
      document.getElementById('back').style.transition  = 'opacity 0.4s ease';
      document.getElementById('back').style.opacity     = '0';
      document.getElementById('badge').style.transition = 'opacity 0.4s ease';
      document.getElementById('badge').style.opacity    = '0';
      document.getElementById('hint').style.opacity     = '0';
    }

    window.addEventListener('wheel', e => { if (e.deltaY > 0) triggerFlyThrough(); }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend',   e => {
      if (touchStartY - e.changedTouches[0].clientY > 40) triggerFlyThrough();
    }, { passive: true });

    // ── Animation ──────────────────────────────────────────────────────
    let tick = 0;
    const BX = 55, BY = 37, BZ = 40;
    const BASE_THRESH = 9, MOUSE_RADIUS = 22;

    const overlay = document.createElement('div');
    Object.assign(overlay.style, {
      position: 'fixed', inset: '0', zIndex: '99',
      background: '#0a1e27', opacity: '0',
      transition: 'opacity 0.8s ease', pointerEvents: 'none',
    });
    document.body.appendChild(overlay);

    function animate() {
      requestAnimationFrame(animate);
      tick += 0.007;

      if (flying) {
        flyProgress = Math.min(flyProgress + 0.018, 1);
        const ease = flyProgress * flyProgress * (3 - 2 * flyProgress);
        camera.position.z = 58 - ease * 90;
        if (flyProgress > 0.45) overlay.style.opacity = Math.min((flyProgress - 0.45) / 0.55, 1).toFixed(3);
        if (flyProgress >= 1) { window.location.href = '/'; return; }
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
        return;
      }

      scene.rotation.y = Math.sin(tick * 0.18) * 0.25;
      scene.rotation.x = Math.sin(tick * 0.11) * 0.10;

      camTX += (mouse.x * 3.5 - camTX) * 0.035;
      camTY += (mouse.y * 2.2 - camTY) * 0.035;
      camera.position.x = camTX;
      camera.position.y = camTY;
      camera.lookAt(0, 0, 0);

      for (let i = 0; i < N; i++) {
        const s = Math.sin(tick + phase[i]) * 0.003;
        pos[i*3]   += vel[i*3]   + s;
        pos[i*3+1] += vel[i*3+1] + s * 0.6;
        pos[i*3+2] += vel[i*3+2];

        if (pos[i*3]   >  BX || pos[i*3]   < -BX) vel[i*3]   *= -1;
        if (pos[i*3+1] >  BY || pos[i*3+1] < -BY) vel[i*3+1] *= -1;
        if (pos[i*3+2] >  BZ || pos[i*3+2] < -BZ) vel[i*3+2] *= -1;

        const dx = pos[i*3] - mouseWorld.x, dy = pos[i*3+1] - mouseWorld.y;
        const d  = Math.sqrt(dx*dx + dy*dy);
        const ta = d < MOUSE_RADIUS ? (1 - d / MOUSE_RADIUS) : 0;
        act[i] += (ta - act[i]) * 0.08;

        const a = act[i];
        pCol[i*3]   = 0.290 + a * (0.835 - 0.290);
        pCol[i*3+1] = 0.671 + a * (0.608 - 0.671);
        pCol[i*3+2] = 0.620 + a * (0.196 - 0.620);
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.color.needsUpdate    = true;

      let seg = 0;
      for (let i = 0; i < N && seg < maxSegs - 1; i++) {
        for (let j = i + 1; j < N && seg < maxSegs - 1; j++) {
          const dx = pos[i*3]-pos[j*3], dy = pos[i*3+1]-pos[j*3+1], dz = pos[i*3+2]-pos[j*3+2];
          const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
          const pAct = Math.max(act[i], act[j]);
          const thresh = BASE_THRESH + pAct * 10;

          if (dist < thresh) {
            const t = 1 - dist / thresh;
            lPos[seg*6]   = pos[i*3];   lPos[seg*6+1] = pos[i*3+1]; lPos[seg*6+2] = pos[i*3+2];
            lPos[seg*6+3] = pos[j*3];   lPos[seg*6+4] = pos[j*3+1]; lPos[seg*6+5] = pos[j*3+2];
            const br = t * (0.18 + pAct * 0.55);
            const r = 0.290 + pAct * (0.835 - 0.290);
            const g = 0.671 + pAct * (0.608 - 0.671);
            const b = 0.620 + pAct * (0.196 - 0.620);
            lCol[seg*6]=r*br*3.2; lCol[seg*6+1]=g*br*3.2; lCol[seg*6+2]=b*br*3.2;
            lCol[seg*6+3]=r*br*3.2; lCol[seg*6+4]=g*br*3.2; lCol[seg*6+5]=b*br*3.2;
            seg++;
          }
        }
      }
      lGeo.setDrawRange(0, seg * 2);
      lGeo.attributes.position.needsUpdate = true;
      lGeo.attributes.color.needsUpdate    = true;

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>
</html>
