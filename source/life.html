<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robin Mollah — Career Space Mission</title>
  <meta name="description" content="11+ years of software engineering. A cinematic mission through the work.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://robinmollah.com/life">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --dim: #0a0e14;
      --muted: #1c2633;
      --border: #2a3a50;
      --ghost: #4a5a6e;
      --pale: #7a90a8;
      --light: #aabece;
      --white: #d8e8f2;
      --pure: #f0f6fc;
      --accent: #4a9eff;
      --amber: #e8902a;
      --warm: #ffc060;
      --green: #3ddc84;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --sans: 'IBM Plex Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: auto; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--mono);
      overflow-x: hidden;
      height: 1400vh;
      width: 100%;
    }

    /* ── CANVAS ──────────────────────────────────────────── */
    #space-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── LOADING ─────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.9s ease;
    }
    #loading.fade-out { opacity: 0; pointer-events: none; }

    .ld-eyebrow {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: var(--ghost);
      text-transform: uppercase;
    }
    .ld-bar-wrap {
      width: 180px;
      height: 1px;
      background: var(--border);
    }
    .ld-bar {
      height: 1px;
      background: var(--accent);
      width: 0%;
      transition: width 0.4s ease;
    }
    .ld-items {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 180px;
    }
    .ld-item {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      color: var(--border);
      display: flex;
      justify-content: space-between;
      transition: color 0.3s;
    }
    .ld-item.done { color: var(--accent); }

    /* ── HUD ─────────────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #hud.visible { opacity: 1; }

    .hud-label {
      font-size: 0.54rem;
      letter-spacing: 0.2em;
      color: var(--ghost);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .hud-sep { width: 32px; height: 1px; background: var(--border); }
    .hud-track {
      width: 72px;
      height: 1px;
      background: var(--border);
    }
    .hud-fill {
      height: 1px;
      background: var(--accent);
      width: 0%;
    }

    /* ── NAV ─────────────────────────────────────────────── */
    #mnav {
      position: fixed;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #mnav.visible { opacity: 1; }

    .ndot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background 0.25s, transform 0.25s;
      position: relative;
    }
    .ndot:hover, .ndot.active {
      background: var(--accent);
      transform: scale(1.6);
    }
    .ndot::before {
      content: attr(data-label);
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      color: var(--ghost);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .ndot:hover::before { opacity: 1; }

    /* ── PANELS ──────────────────────────────────────────── */
    .panel {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      opacity: 0;
      pointer-events: none;
    }
    .panel.alive { pointer-events: auto; }

    /* Text shadow for contrast without boxes */
    .panel {
      text-shadow:
        0 0 6px rgba(0,0,10,0.99),
        0 0 18px rgba(0,0,10,0.92),
        0 2px 40px rgba(0,0,10,0.75);
    }
    #p00 { text-align: center; }

    /* alignment variants */
    .pc  { align-items: center; justify-content: center; text-align: center; }
    .pl  { align-items: center; justify-content: flex-start; padding-left: max(6vw, 40px); }
    .pr  { align-items: center; justify-content: flex-end;  padding-right: max(6vw, 40px); }
    .pbl { align-items: flex-end; justify-content: flex-start; padding: 0 max(6vw,40px) 10vh; }

    /* ── TYPOGRAPHY ──────────────────────────────────────── */
    .eyebrow {
      font-size: 0.56rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .eyebrow.amber { color: var(--amber); }

    .display {
      font-size: clamp(2.4rem, 5.5vw, 5.5rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 0.92;
      color: var(--pure);
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .display.lg { font-size: clamp(3.2rem, 7.5vw, 8rem); }
    .display.md { font-size: clamp(1.8rem, 3.5vw, 3.4rem); }
    .display.sm { font-size: clamp(1.4rem, 2.8vw, 2.6rem); }

    .body {
      font-family: var(--sans);
      font-size: clamp(0.88rem, 1.1vw, 1.05rem);
      font-weight: 300;
      line-height: 1.75;
      color: var(--light);
      max-width: 500px;
    }

    .rule { width: 28px; height: 1px; background: var(--border); margin: 18px 0; }

    .tagrow { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .tag {
      font-size: 0.54rem;
      letter-spacing: 0.14em;
      color: var(--pale);
      border: 1px solid var(--border);
      padding: 4px 9px;
      text-transform: uppercase;
    }
    .tag.hi { color: var(--accent); border-color: var(--accent); }
    .tag.warn { color: var(--amber); border-color: var(--amber); }

    /* ── M00 — LAUNCH ────────────────────────────────────── */
    .m00-name {
      font-size: clamp(2.8rem, 7vw, 7.5rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--pure);
      text-transform: uppercase;
      line-height: 0.9;
      margin-bottom: 6px;
    }
    .m00-title {
      font-size: clamp(0.65rem, 1.1vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--pale);
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .m00-meta {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      color: var(--ghost);
      margin-bottom: 6px;
    }
    .m00-scroll {
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: var(--accent);
      text-transform: uppercase;
      margin-top: 36px;
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ── M01 — ORIGIN ────────────────────────────────────── */
    .skill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 24px;
    }
    .skill-item {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }
    .skill-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .skill-text {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--pale);
      text-transform: uppercase;
    }

    /* ── M02 — EXPERIENCE ────────────────────────────────── */
    .dest-inner { max-width: 500px; }
    .dest-num {
      font-size: 0.54rem;
      letter-spacing: 0.2em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .dest-company {
      font-size: clamp(1.5rem, 3.2vw, 3rem);
      font-weight: 700;
      color: var(--pure);
      text-transform: uppercase;
      line-height: 0.93;
      letter-spacing: 0.03em;
    }
    .dest-role {
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--pale);
      text-transform: uppercase;
      margin-top: 10px;
    }
    .dest-period {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      color: var(--ghost);
      margin-top: 3px;
    }
    .achievements { margin-top: 22px; display: flex; flex-direction: column; gap: 11px; }
    .ach {
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }
    .ach-dash { font-size: 0.56rem; color: var(--accent); flex-shrink: 0; margin-top: 3px; }
    .ach-text {
      font-family: var(--sans);
      font-size: 0.86rem;
      line-height: 1.65;
      color: var(--light);
      font-weight: 300;
    }

    /* ── M03 — SYSTEMS ───────────────────────────────────── */
    .sys-inner { max-width: 520px; }
    .sys-quote {
      font-size: clamp(1.5rem, 2.8vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      color: var(--pure);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .sys-wrap {
      margin-top: 28px;
      width: min(440px, 88vw);
      height: 240px;
    }
    #sys-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── M04 — PROJECTS ──────────────────────────────────── */
    .proj-inner { max-width: 500px; }
    .proj-title {
      font-size: clamp(1.4rem, 2.8vw, 2.6rem);
      font-weight: 700;
      color: var(--pure);
      text-transform: uppercase;
      line-height: 0.93;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .proj-type {
      font-size: 0.54rem;
      letter-spacing: 0.18em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .proj-block { margin-bottom: 14px; }
    .proj-lbl {
      font-size: 0.52rem;
      letter-spacing: 0.18em;
      color: var(--ghost);
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .proj-val {
      font-family: var(--sans);
      font-size: 0.86rem;
      line-height: 1.65;
      color: var(--light);
      font-weight: 300;
    }
    .impact {
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 700;
      color: var(--green);
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }

    /* ── M05 — LAB ───────────────────────────────────────── */
    .lab-items { display: flex; flex-direction: column; gap: 22px; max-width: 480px; }
    .lab-item { border-left: 1px solid var(--border); padding-left: 16px; }
    .lab-id {
      font-size: 0.53rem;
      letter-spacing: 0.2em;
      color: var(--ghost);
      margin-bottom: 4px;
    }
    .lab-name {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--pure);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .lab-status {
      font-size: 0.52rem;
      letter-spacing: 0.16em;
      padding: 2px 7px;
      border: 1px solid;
      display: inline-block;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .lab-status.active { color: var(--green); border-color: var(--green); }
    .lab-status.proto { color: var(--amber); border-color: var(--amber); }
    .lab-desc {
      font-family: var(--sans);
      font-size: 0.82rem;
      line-height: 1.65;
      color: var(--pale);
      font-weight: 300;
    }

    /* ── M06 — NEXT FRONTIER ─────────────────────────────── */
    .frontier-inner { max-width: 600px; text-align: center; }
    .frontier-hed {
      font-size: clamp(1.8rem, 4vw, 4rem);
      font-weight: 700;
      line-height: 1.05;
      color: var(--pure);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
    }
    .frontier-sub {
      font-size: clamp(1rem, 2vw, 2rem);
      font-weight: 300;
      color: var(--pale);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 44px;
    }
    .clinks {
      display: flex;
      flex-direction: column;
      gap: 11px;
      align-items: center;
      margin-bottom: 36px;
    }
    .clink {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      color: var(--pale);
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .clink:hover { color: var(--accent); border-color: var(--accent); }
    .mission-end {
      font-size: 0.56rem;
      letter-spacing: 0.22em;
      color: var(--ghost);
      text-transform: uppercase;
    }

    /* ── RESPONSIVE ──────────────────────────────────────── */
    @media (max-width: 768px) {
      .pl { padding-left: max(5vw, 24px); }
      .pr { padding-right: max(5vw, 24px); justify-content: flex-start; align-items: flex-start; padding-top: 15vh; }
      #mnav { display: none; }
      .skill-grid { grid-template-columns: 1fr; }
      body { height: 1700vh; }
    }

    /* ── ROCKET ──────────────────────────────────────────── */
    #rocket-canvas {
      position: fixed;
      inset: 0;
      z-index: 15;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #rocket-canvas.active { opacity: 1; }
    #whitewash {
      position: fixed;
      inset: 0;
      z-index: 16;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #whitewash.flash { opacity: 1; }
    #whitewash.gone  { opacity: 0; }

    /* media slot placeholder */
    .media-slot {
      margin-top: 20px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .media-label {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      color: var(--ghost);
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .panel { transition: opacity 0.1s; }
      #loading { transition: none; }
      .m00-scroll { animation: none; opacity: 0.7; }
    }
  </style>
</head>

  <div class="ld-eyebrow">Initializing Mission</div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ld-bar"></div></div>
  <div class="ld-items">
    <div class="ld-item" id="ld-env">ENVIRONMENT<span>—</span></div>

<section class="panel pl"  id="p_brac_c" aria-label="BRACU Bot"></section>

<section class="panel pl"  id="p02b"     aria-label="Eagle 3D Streaming"></section>
<section class="panel pr"  id="p02c"     aria-label="GoBubble AI"></section>
<section class="panel pl"  id="p03"      aria-label="Systems"></section>
<section class="panel pr"  id="p04a"     aria-label="9x Scale"></section>
<section class="panel pl"  id="p04b"     aria-label="AI Infrastructure"></section>
<section class="panel pl"  id="p05"      aria-label="The Lab"></section>
<section class="panel pc"  id="p06"      aria-label="Next Frontier"></section>

<script>
(function () {
  const missions = [
    ['p00','life/m00.html'], ['p01','life/m01.html'],
    ['p_game','life/m_game.html'],
    ['p_brac_a','life/m_brac_a.html'], ['p_brac_b','life/m_brac_b.html'], ['p_brac_c','life/m_brac_c.html'],
    ['p02a','life/m02a.html'], ['p02b','life/m02b.html'], ['p02c','life/m02c.html'],
    ['p03','life/m03.html'],
    ['p04a','life/m04a.html'], ['p04b','life/m04b.html'],
    ['p05','life/m05.html'], ['p06','life/m06.html'],
  ];
  Promise.all(missions.map(([id, url]) =>
    fetch(url).then(r => r.text()).then(html => {
      document.getElementById(id).innerHTML = html;
    })
  )).catch(console.warn);
})();
</script>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ── Loading ──────────────────────────────────────────────
  const ldBar  = document.getElementById('ld-bar');
  const ldEnv  = document.getElementById('ld-env');
  const ldSc   = document.getElementById('ld-sc');
  const ldData = document.getElementById('ld-data');

  function setLoad(pct, el) {
    ldBar.style.width = pct + '%';
    if (el) el.classList.add('done');
  }

  document.documentElement.style.overflow = 'hidden';

  // ── Renderer ─────────────────────────────────────────────
  const canvas   = document.getElementById('space-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000002, 1);
  renderer.setSize(innerWidth, innerHeight);

  const scene  = new THREE.Scene();
  scene.fog    = new THREE.FogExp2(0x000002, 0.0018);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 800);
  camera.position.set(0, 12, 38);

  setLoad(18, ldEnv);

  // ── Lighting ─────────────────────────────────────────────
  scene.add(new THREE.AmbientLight(0x0d1a2e, 2.5));
  const sun = new THREE.DirectionalLight(0xfff0e0, 1.6);
  sun.position.set(80, 50, 100);
  scene.add(sun);

  // ── Stars ─────────────────────────────────────────────────
  function makeStars(n, rMin, rMax, sz, cx, cy, cz) {
    const pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const r = rMin + Math.random() * (rMax - rMin);
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pos[i * 3]     = cx + r * Math.sin(ph) * Math.cos(th);
      pos[i * 3 + 1] = cy + r * Math.sin(ph) * Math.sin(th);
      pos[i * 3 + 2] = cz + r * Math.cos(ph);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({
      color: 0xffffff, size: sz, sizeAttenuation: true,
      transparent: true, opacity: 0.9,
    }));
  }
  scene.add(makeStars(2800, 100, 480, 0.24, 0, 0, -145));
  scene.add(makeStars(500,  25,  80, 0.10, 0, 0, -145));

  // ── Earth texture (canvas) ─────────────────────────────────
  function createEarthTexture() {
    const W = 2048, H = 1024;
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const ctx = off.getContext('2d');

    function px(lon, lat) { return [(lon + 180) / 360 * W, (90 - lat) / 180 * H]; }

  function animate() {

    mouseSmooth.y += (mouseRaw.y - mouseSmooth.y) * 0.05;

    // Parallax: offset camera slightly from path based on mouse position

    const hit  = hits.length > 0 ? hits[0].object : null;
    if (hit !== hoveredMesh) {
      if (hoveredMesh) {
        hoveredMesh.scale.setScalar(1);
        hoveredMesh.material.emissiveIntensity = hoveredMesh.userData.baseEmissive ?? 0.2;

      hoveredMesh = hit;

      }
      document.body.style.cursor = hit ? 'pointer' : '';

  // ── Rocket launch ──────────────────────────────────────────
  const rocketCanvas  = document.getElementById('rocket-canvas');

  const ROCKET_DUR    = 2200; // ms
  let   rocketStart   = 0;
  const flames        = [];

  function initFlames(cx, cy) {
    flames.length = 0;
    for (let i = 0; i < 120; i++) {
      flames.push({
        x: cx + (Math.random() - 0.5) * 18,
        y: cy,
        vx: (Math.random() - 0.5) * 2.5,

  function drawRocket(ts) {
    if (!rocketActive) return;
    rocketT = Math.min((ts - rocketStart) / ROCKET_DUR, 1);

    const W = rocketCanvas.width  / devicePixelRatio;
    const H = rocketCanvas.height / devicePixelRatio;
    rocketCtx.clearRect(0, 0, W, H);

    // Rocket travels from bottom centre upward and off screen
    const startY = H * 0.88;
    const cx     = W * 0.5;
    const rktY   = startY - rocketT * (H * 1.25);
    const ease   = rocketT < 0.5 ? 2 * rocketT * rocketT : 1 - Math.pow(-2 * rocketT + 2, 2) / 2;
    const bodyH  = 54;
    const bodyW  = 16;

    // ── Exhaust plume ─────────────────────────
    flames.forEach(f => {
      f.life += 0.045;
      if (f.life > f.maxLife) {
        f.x = cx + (Math.random() - 0.5) * 16;
        f.y = rktY + bodyH * 0.5 + 4;
        f.vx = (Math.random() - 0.5) * 2.5;
        f.vy = Math.random() * 5 + 2;
        f.life = 0;
        f.maxLife = 0.4 + Math.random() * 0.7;
        f.size = 3 + Math.random() * 9;
        f.hue = 15 + Math.random() * 45;
      }
      const t  = f.life / f.maxLife;
      const fx = f.x + f.vx * f.life * 18;
      const fy = (rktY + bodyH * 0.5 + 4) + f.vy * f.life * 22;
      const sz = f.size * (1 - t * 0.6);
      const al = (1 - t) * 0.9;
      const rg = rocketCtx.createRadialGradient(fx, fy, 0, fx, fy, sz * 2.5);
      rg.addColorStop(0, `hsla(${f.hue}, 100%, 90%, ${al})`);
      rg.addColorStop(0.4, `hsla(${f.hue + 20}, 100%, 60%, ${al * 0.7})`);
      rg.addColorStop(1, `hsla(${f.hue + 40}, 100%, 40%, 0)`);
      rocketCtx.beginPath();
      rocketCtx.arc(fx, fy, sz * 2.5, 0, Math.PI * 2);
      rocketCtx.fillStyle = rg;
      rocketCtx.fill();
    });

    // ── Rocket body ───────────────────────────
    // Fuselage
    const bodyGrad = rocketCtx.createLinearGradient(cx - bodyW, rktY, cx + bodyW, rktY);
    bodyGrad.addColorStop(0, '#c0c8d8');
    bodyGrad.addColorStop(0.35, '#ffffff');
    bodyGrad.addColorStop(0.65, '#e8eef8');
    bodyGrad.addColorStop(1, '#8898a8');
    rocketCtx.fillStyle = bodyGrad;
    rocketCtx.beginPath();
    rocketCtx.roundRect(cx - bodyW * 0.5, rktY - bodyH * 0.5, bodyW, bodyH, 4);
    rocketCtx.fill();

    // Nose cone
    rocketCtx.fillStyle = '#e82030';
    rocketCtx.beginPath();
    rocketCtx.moveTo(cx - bodyW * 0.5, rktY - bodyH * 0.5);
    rocketCtx.lineTo(cx + bodyW * 0.5, rktY - bodyH * 0.5);
    rocketCtx.lineTo(cx, rktY - bodyH * 0.5 - 24);
    rocketCtx.closePath();
    rocketCtx.fill();

    // Fins
    [[1],[-1]].forEach(([s]) => {
      rocketCtx.fillStyle = '#9b2335';
      rocketCtx.beginPath();
      rocketCtx.moveTo(cx + s * bodyW * 0.5, rktY + bodyH * 0.5 - 4);
      rocketCtx.lineTo(cx + s * (bodyW * 0.5 + 14), rktY + bodyH * 0.5 + 8);
      rocketCtx.lineTo(cx + s * bodyW * 0.5, rktY + bodyH * 0.5 - 16);
      rocketCtx.closePath();
      rocketCtx.fill();
    });

    // Window
    rocketCtx.beginPath();
    rocketCtx.arc(cx, rktY - bodyH * 0.12, 5, 0, Math.PI * 2);
    rocketCtx.fillStyle = '#7ad4ff';
    rocketCtx.fill();
    rocketCtx.strokeStyle = '#888';
    rocketCtx.lineWidth = 1;
    rocketCtx.stroke();

    // ── Shock rings ────────────────────────────
    if (rocketT < 0.3) {
      const ringAl = (0.3 - rocketT) / 0.3 * 0.6;
      [30, 55, 80].forEach((r, i) => {
        const rr = r + rocketT * 60 * (i + 1);
        rocketCtx.beginPath();
        rocketCtx.arc(cx, startY, rr, 0, Math.PI * 2);
        rocketCtx.strokeStyle = `rgba(255,180,60,${ringAl * (1 - i * 0.3)})`;
        rocketCtx.lineWidth = 2 - i * 0.5;
        rocketCtx.stroke();
      });
    }

    if (rocketT >= 1) {
      rocketActive = false;
      rocketCanvas.classList.remove('active');
      rocketCtx.clearRect(0, 0, W, H);
      return;
    }
    requestAnimationFrame(drawRocket);
  }

  function launchRocket() {
    if (rocketActive) return;
    rocketActive = true;
    rocketStart  = performance.now();
    const W = innerWidth, H = innerHeight;
    rocketCanvas.width  = W * devicePixelRatio;
    rocketCanvas.height = H * devicePixelRatio;
    rocketCtx.scale(devicePixelRatio, devicePixelRatio);
    rocketCanvas.classList.add('active');
    initFlames(W * 0.5, H * 0.88);
    requestAnimationFrame(drawRocket);
  }

  // Fire rocket on first scroll past 2%
  let rocketFired = false;
  window.addEventListener('scroll', () => {
    if (!rocketFired && window.scrollY > innerHeight * 0.48) {
      rocketFired = true;
      launchRocket();
    }
  }, { passive: true });

  // ── Boot ───────────────────────────────────────────────────
  setLoad(90);
  resizeSys();

  setTimeout(() => {
    setLoad(100);
    const loadEl = document.getElementById('loading');
    loadEl.classList.add('fade-out');
    document.getElementById('hud').classList.add('visible');
    document.getElementById('mnav').classList.add('visible');
    document.documentElement.style.overflow = '';
    setTimeout(() => { loadEl.style.display = 'none'; }, 1000);
    requestAnimationFrame(animate);
  }, 900);

})();
</script>
</body>
</html>
